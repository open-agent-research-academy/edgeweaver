<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call __TITLE__</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: var(--tg-theme-bg-color, #ffffff); --fg: var(--tg-theme-text-color, #111111); --muted: var(--tg-theme-hint-color, #707579);
    --btn: var(--tg-theme-button-color, #2481cc); --btn-fg: var(--tg-theme-button-text-color, #ffffff); --card: var(--tg-theme-secondary-bg-color, #f1f1f4); --bad: #d93a3a; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 32px; background: var(--bg); color: var(--fg); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  button { width: 100%; border: 0; border-radius: 12px; padding: 16px; font-size: 17px; font-weight: 600; background: var(--btn); color: var(--btn-fg); cursor: pointer; }
  button.leave { background: var(--bad); color: #fff; }
  button:disabled { opacity: .55; }
  #status { margin: 14px 0 22px; color: var(--muted); font-size: 15px; min-height: 21px; }
  .card { background: var(--card); border-radius: 12px; padding: 12px 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; padding: 6px 0; }
  li span:last-child { color: var(--muted); font-size: 14px; }
  .live { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .orb { position: relative; width: 22px; height: 22px; flex: none; }
  .orb::before, .orb::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--ok, #34c759); }
  .orb::after { animation: beat 1.6s ease-out infinite; }
  .live.quiet .orb::before, .live.quiet .orb::after { background: #f5a623; }
  .live.quiet .orb::after { animation: none; }
  @keyframes beat { from { transform: scale(1); opacity: .6; } to { transform: scale(2.4); opacity: 0; } }
  #what { font-size: 16px; font-weight: 600; flex: 1; }
  .bars { display: none; gap: 3px; align-items: center; height: 18px; }
  .live.speaking .bars { display: flex; }
  .bars i { width: 4px; height: 100%; border-radius: 2px; background: var(--btn); transform-origin: center; transform: scaleY(.2); transition: transform .12s; }
  .think::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  @media (prefers-reduced-motion: reduce) { .orb::after, .think::after { animation: none; } }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #34c759; margin-right: 8px; vertical-align: middle; }
</style>
</head>
<body>
  <h1>Call __TITLE__</h1>
  <div class="sub">Talk live with __TITLE__. Anyone else on the call hears the same conversation.</div>
  <button id="go">Join the call</button>
  <div id="status"></div>
  <div id="live" class="card live" hidden aria-live="polite"><span class="orb"></span><span id="what">Connected</span><span class="bars"><i></i><i></i><i></i><i></i></span></div>
  <button id="hear" hidden>Tap to hear __TITLE__</button>
  <div style="height:16px"></div>
  <div class="card"><h2>On the call</h2><ul id="people"><li><span>Nobody yet</span><span></span></li></ul></div>
  <audio id="remote" autoplay playsinline></audio>
<script type="module">
import { TelnyxRTC } from "https://cdn.jsdelivr.net/npm/@telnyx/webrtc@__SDK__/+esm";
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const initData = tg?.initData || new URLSearchParams(location.hash.slice(1)).get("initData") || ""; // (the hash form is for headless tests; it must still be signed)
const $ = (id) => document.getElementById(id);
const say = (t) => { $("status").textContent = t; };
const post = (path, body = {}) => fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ initData, ...body }) })
  .then(async (r) => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.status); return j; });
const fmt = (t) => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
let client = null, call = null;
// each step and error goes back to the bridge log (tg-client rows), so a failure inside Telegram is visible
const seen = new Set(); // the SDK can repeat one error hundreds of times while a call ends; report each once
const report = (step, detail) => { const k = `${step}|${detail}`; if (seen.has(k)) return; seen.add(k); post("/api/tg/event", { step, detail: String(detail ?? "").slice(0, 300) }).catch(() => {}); };
// Android's WebView (Telegram's in-app browser) only plays sound a tap started, and the SDK just sets srcObject and
// relies on autoplay: so the join tap starts the element, and the call's audio is played on it explicitly
const speaker = $("remote");
async function playRemote(why) {
  const s = call?.remoteStream; if (s && speaker.srcObject !== s) speaker.srcObject = s;
  speaker.muted = false; speaker.volume = 1;
  try { await speaker.play(); $("hear").hidden = true; report("audio", `playing (${why})`); }
  catch (e) { $("hear").hidden = false; report("audio-blocked", `${why}: ${e.name} ${e.message}`); }
}
$("hear").onclick = () => playRemote("tap to hear");
async function audioStats(when) { // is sound reaching this page, and is the element playing it?
  try {
    const pc = call?.peer?.instance; const t = speaker.srcObject?.getAudioTracks?.()[0];
    let rtp = "no stats";
    if (pc) for (const r of (await pc.getStats()).values()) if (r.type === "inbound-rtp" && r.kind === "audio")
      rtp = `packets=${r.packetsReceived} level=${(r.audioLevel ?? -1).toFixed(3)} energy=${(r.totalAudioEnergy ?? -1).toFixed(3)}`;
    report("audio-stats", `${when}: ${rtp} el.paused=${speaker.paused} ready=${speaker.readyState} track=${t ? `${t.readyState}${t.muted ? " muted" : ""}` : "none"}`);
  } catch (e) { report("audio-stats", `${when}: ${e.message}`); }
}

// While on a call: a pulse that beats while Genesis's audio keeps arriving, and one line for what is happening. Speaking
// comes from the level of the audio this page receives; thinking/hearing/listening from the bridge (roster.activity);
// the line going quiet or the microphone not sending come from the call's own packet counts.
let activity = null, meter = null;
const live = { linkOk: true, micOk: true, level: 0, quietSince: 0, stalls: 0 };
function renderLive() {
  const el = $("live"), what = $("what"); if (!call) { el.hidden = true; return; }
  el.hidden = false;
  const speaking = live.linkOk && live.level > 0.02;
  el.className = `card live${live.linkOk ? "" : " quiet"}${speaking ? " speaking" : ""}`;
  what.className = "";
  if (!live.linkOk) what.textContent = "The line went quiet. Still trying...";
  else if (!live.micOk) what.textContent = "Your microphone isn't sending. __TITLE__ can't hear you.";
  else if (speaking) what.textContent = "__TITLE__ is speaking";
  else if (activity === "thinking") { what.textContent = "__TITLE__ is thinking"; what.className = "think"; }
  else if (activity === "hearing") what.textContent = "__TITLE__ hears you";
  else what.textContent = "__TITLE__ is listening. Go ahead.";
  [...el.querySelectorAll(".bars i")].forEach((b, i) => { b.style.transform = `scaleY(${speaking ? Math.min(1, 0.25 + live.level * (2.2 + (i % 2) * 1.2) + Math.random() * 0.2) : 0.2})`; });
}
function startMeter() {
  let lastIn = -1, lastOut = -1, inStill = 0, outStill = 0;
  meter = setInterval(async () => {
    const pc = call?.peer?.instance; if (!pc) return;
    let inP = lastIn, outP = lastOut;
    try { for (const r of (await pc.getStats()).values()) {
      if (r.type === "inbound-rtp" && r.kind === "audio") { inP = r.packetsReceived; live.level = r.audioLevel ?? 0; }
      if (r.type === "outbound-rtp" && r.kind === "audio") outP = r.packetsSent;
    } } catch { return; }
    inStill = inP > lastIn ? 0 : inStill + 1; outStill = outP > lastOut ? 0 : outStill + 1; lastIn = inP; lastOut = outP;
    const linkOk = inStill < 4, micOk = outStill < 4; // 2 s with no packets
    if (linkOk !== live.linkOk) report("link", linkOk ? `audio back after ${((Date.now() - live.quietSince) / 1000).toFixed(1)} s` : `no audio packets for 2 s (#${++live.stalls})`);
    if (!linkOk && live.linkOk) live.quietSince = Date.now();
    if (micOk !== live.micOk) report("mic", micOk ? `sending again (#${live.stalls})` : `not sending for 2 s (#${++live.stalls})`);
    live.linkOk = linkOk; live.micOk = micOk;
    renderLive();
  }, 500);
}
function stopMeter() { clearInterval(meter); meter = null; activity = null; Object.assign(live, { linkOk: true, micOk: true, level: 0 }); renderLive(); }

async function roster() {
  try {
    const r = await post("/api/tg/roster");
    activity = r.activity || null;
    const ul = $("people"); ul.innerHTML = "";
    if (!r.people.length) ul.innerHTML = "<li><span>Nobody yet</span><span></span></li>";
    for (const p of r.people) { const li = document.createElement("li"); li.innerHTML = `<span><span class="dot"></span></span><span></span>`;
      li.firstChild.append(`${p.name}${p.via === "telegram" ? "" : p.via === "phone" ? " (phone)" : ""}`); li.lastChild.textContent = `since ${fmt(p.since)}`; ul.append(li); }
  } catch (e) { if (!initData) say("Open this from the button in Telegram."); else if (String(e.message).includes("not open")) say("This call isn't open to you yet."); }
}
let tick = 0; roster(); setInterval(() => { if (call || ++tick % 3 === 0) roster(); }, 1000); // every second on a call, for the thinking line

// ended: the call already hung up, so only the client is closed (hanging up an ended call makes the SDK error in a loop)
function hangup(ended) { const c = call, cl = client; call = null; client = null; if (!ended) try { c?.hangup(); } catch {} try { cl?.disconnect(); } catch {}
  speaker.srcObject = null; $("hear").hidden = true; stopMeter(); $("go").textContent = "Join the call"; $("go").className = ""; $("go").disabled = false; }

$("go").onclick = async () => {
  if (call) { hangup(); say("You left the call."); return; }
  speaker.play().catch(() => {}); // inside the tap, before any await: unlocks the element for the call's audio
  $("go").disabled = true; say("Joining...");
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true }).then((s) => s.getTracks().forEach((t) => t.stop())); // ask for the microphone up front
    const j = await post("/api/tg/join");
    report("token", "ok");
    client = new TelnyxRTC({ login_token: j.token });
    client.remoteElement = "remote";
    const stall = setTimeout(() => { if (!call) { report("stall", "no telnyx.ready after 15 s"); say("Couldn't reach the phone service. Try again."); hangup(); } }, 15000);
    client.on("telnyx.ready", () => { clearTimeout(stall); report("ready"); call = client.newCall({ destinationNumber: j.number, audio: true, video: false, remoteElement: "remote" }); });
    client.on("telnyx.error", (e) => { report("error", e?.error?.message || e?.message || JSON.stringify(e)); if (!client || call) return; clearTimeout(stall); say("Couldn't connect. Try again."); hangup(); }); // after leaving, a late error is not news
    client.on("telnyx.socket.close", () => report("socket-close"));
    client.on("telnyx.notification", (n) => {
      if (!n.call) return;
      const st = n.call.state;
      if (st !== n.call.__lastReported) { n.call.__lastReported = st; report("call", st + (n.call.cause ? ` ${n.call.cause}` : "")); }
      if (st === "active") {
        say(`You're on the call, ${j.name}. Speak whenever you like.`); $("go").textContent = "Leave the call"; $("go").className = "leave"; $("go").disabled = false;
        if (!n.call.__playing) { n.call.__playing = true; playRemote("call active"); startMeter(); renderLive(); setTimeout(() => audioStats("5 s"), 5000); setTimeout(() => audioStats("20 s"), 20000); }
      }
      else if (st === "ringing" || st === "trying" || st === "requesting") say("Connecting...");
      else if (st === "hangup" || st === "destroy") { if (call) say("The call ended."); hangup(true); }
    });
    client.connect();
  } catch (e) { report("join-failed", `${e.name}: ${e.message}`); say(e.name === "NotAllowedError" ? "Telegram needs microphone access to join." : `Couldn't join: ${e.message}`); hangup(); }
};
window.addEventListener("pagehide", () => hangup());
</script>
</body>
</html>
